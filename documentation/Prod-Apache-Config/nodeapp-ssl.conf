<IfModule mod_ssl.c>
<VirtualHost *:443>
    SSLProxyEngine on
    
    ServerName api.cpd-purchasing.cookeville-tn.org
    SSLCertificateFile /etc/letsencrypt/live/cpd-purchasing.cookeville-tn.org/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/cpd-purchasing.cookeville-tn.org/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    # Set CORS headers
    <IfModule mod_headers.c>
        Header set Access-Control-Allow-Origin "*"
        Header set Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS"
        Header set Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept, Authorization, uuidSessionToken"
        Header set Access-Control-Allow-Credentials "true"
    </IfModule>

    # Handle preflight requests
    # RewriteEngine On
    # RewriteCond %{REQUEST_METHOD} OPTIONS
    # RewriteRule ^(.*)$ $1 [R=200,L]

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyVia Full

    <Proxy *>
        Require all granted
    </Proxy>

    ProxyPass / http://127.0.0.1:8000/
    ProxyPassReverse / http://127.0.0.1:8000/

    # ProxyPass /alive http://127.0.0.1:8000/alive
    # ProxyPassReverse /alive http://127.0.0.1:8000/alive

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
</IfModule>

