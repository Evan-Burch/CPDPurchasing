<!DOCTYPE html>
<html lang="en">

<style>
    .scrollbar1::-webkit-scrollbar {
        width: 12px;
    }

    .scrollbar1::-webkit-scrollbar-track {
        border-radius: 8px;
        background-color: #646363;

        cursor: pointer;
    }
    
    .activity-item:hover {
        color: rgb(150, 150, 150); /* Change text color to light blue on hover */

<body>
    <!-- create a container spanning the entire width of the viewport -->
    <div class="container-fluid">
        <!-- card for the carousel -->
        <div class="card mt-3">
            <div class="card-header" id="Chartdiv">
                <h4>Charts</h4>
            </div>
            <!-- carousel for Charts -->
            <div id="carousel" class="carousel slide">
                <div class="carousel-inner">
                    <!-- First Slide -->
                    <div class="carousel-item active" style="color:white">
                        <div class="d-flex justify-content-center align-items-center p-3">
                            <canvas id="chart1" height=200 width=400></canvas>
                        </div>
                    </div>
                    <!-- Second Slide -->
                    <div class="carousel-item">
                        <div class="d-flex justify-content-center align-items-center">
                            <canvas id="chart2" height=400 width=800></canvas>
                        </div>
                    </div>
                    <!-- Third Slide
                    <div class="carousel-item">
                        <div class="d-flex justify-content-center align-items-center">
                            <canvas id="chart3" height=400></canvas>
                        </div>
                    </div> -->
                </div>
                <button class="carousel-control-prev" type="button" data-bs-target="#carousel" data-bs-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Previous</span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#carousel" data-bs-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Next</span>
                </button>
            </div>
        </div>

        <!-- Second Row for Recent Activity and Upcoming Billing -->
        <div class="row mb-3 justify-content-center">
            <!-- Recent Activity Card -->
            <div class="col-md-4 col-sm-12 p-3">
                <div class="card h-100 d-flex flex-column">
                    <div class="card-header">
                        <h4>Recent Activity</h4>
                    </div>
                    <div class="card-body flex-grow-1 scrollbar1" style="overflow-y: auto;">
                        <ul id="recentActivityList" class="list-group">
                            <!-- List items will be dynamically added here -->
                        </ul>
                    </div>
                </div>
            </div>

            <!-- Upcoming Billing Card -->
            <div class="col-md-8 col-sm-12 p-3">
                <div class="card h-100 d-flex flex-column">
                    <div class="card-header">
                        <h4>Calendar</h4>
                    </div>
                    <div class="card-body flex-grow-1 scrollbar1" style="overflow-y: auto;">
                        <div id='calendar'></div>
                    </div>
                </div>
            </div>
        </div>
        <!-- Event Details Popup -->
        <div class="modal fade" id="eventDetailsPopup" tabindex="-1" aria-labelledby="eventDetailsPopupLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h1 class="modal-title fs-5" id="staticBackdropLabel">Calendar Event</h1>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <!-- <label for="txtEditVendor" class="form-label">Vendor</label>
                        <select class="form-select" id="txtEditVendor" aria-label="Vendor">
                            <option selected disabled>Select Vendor</option>
                        </select>

                        <label for="txtEditVendorContact" class="form-label">Vendor Contact</label>
                        <select class="form-select" id="txtEditVendorContact" aria-label="Vendor Contact">
                            <option selected disabled>Select Vendor Contact</option>
                        </select>

                        <label for="txtEditRequestedFor" class="form-label">Requested For</label>
                        <select class="form-select" id="txtEditRequestedFor" aria-label="Requested For">
                            <option selected disabled>Select Requested For</option>
                        </select>

                        <label for="txtEditFiscalAuthority" class="form-label">Request Approval From</label>
                        <select class="form-select req" id="txtEditFiscalAuthority" aria-label="Fiscal Authority" required>
                            <option selected disabled>Select Fiscal Authority</option>
                        </select>

                        <label for="txtEditNotes" class="form-label">Notes</label>
                        <input type="text" class="form-control" id="txtEditNotes" placeholder="Notes">

                        <label class="form-label" for="btnSwitch">Active</label>
                            <input type="checkbox" id="btnSwitch">
                            <label for="btnSwitch" class="toggleSwitch">
                            </label> -->
                        <label for="txtEditTitle" class="form-label">Title</label>
                        <input type="text" class="form-control" id="txtEditTitle" placeholder="Title">
                        
                        <label for="txtEditDate" class="form-label">Date</label>
                        <input type="date" class="form-control" id="txtEditDate">

                        <label for="txtEditNotes" class="form-label">Notes</label>
                        <textarea class="form-control" id="txtEditNotes" placeholder="Notes"></textarea>
    

                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-success" id="btnEdit">Edit</button>
                        <button type="button" class="btn btn-danger" id="btnDelete">Delete</button>
                        <button type="button" class="btn btn-primary" data-bs-dismiss="modal">Close</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Event Details Popup -->
        <div class="modal fade" id="createEventPopup" tabindex="-1" aria-labelledby="eventDetailsPopupLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h1 class="modal-title fs-5" id="staticBackdropLabel">Create Calendar Event</h1>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <label for="txtCreateTitle" class="form-label" required>Title</label>
                        <input type="text" class="form-control" id="txtCreateTitle" placeholder="Title">

                        <label for="txtCreateNotes" class="form-label">Notes</label>
                        <textarea class="form-control" id="txtCreateNotes" placeholder="Notes"></textarea>    

                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-success" id="btnCreateEvent">Create</button>
                        <button type="button" class="btn btn-primary" data-bs-dismiss="modal">Close</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JavaScript Bundle (for carousel functionality) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JavaScript to initialize Chart.js charts -->
    <script>

        var doughnutChart;
        var barChart;
        var lineChart;

        // change chart colors depending on page theme
        // Change chart colors based on the current theme
        async function changeChartColors() {
            const currentTheme = $('html').attr('data-bs-theme');
            const isDarkTheme = currentTheme === 'dark';
            
            const textColor = isDarkTheme ? 'white' : 'black';

            Chart.defaults.color = textColor;
            
            // Update chart datasets
            doughnutChart.data.datasets[0].borderColor = textColor;
            barChart.data.datasets.forEach(dataset => {
                dataset.borderColor = textColor;
            });
            lineChart.data.datasets[0].borderColor = textColor;

            // Update the charts
            doughnutChart.update();
            barChart.update();
            lineChart.update();

            // Update the carousel slide text
            $('.carousel-item').css('color', textColor);
        }

        // Detect theme changes
        function detectThemeChange() {
            const observer = new MutationObserver(() => {
                changeChartColors();
            });

            observer.observe(document.documentElement, {
                attributes: true,
                attributeFilter: ['data-bs-theme']
            });
        }

        $(document).ready(function () {
            // Initialize theme detection
            detectThemeChange();

            // Initial chart color setup
            changeChartColors();
        });


        $(document).ready(function () {
            var calendarEvents = [];

            // Fetch reminders via AJAX
            $.ajax({
                type: 'POST',
                url: `${apiCall}/getReminders`,
                data: JSON.stringify({ uuidSessionToken: sessionStorage.getItem('SimpleSession') }),
                contentType: 'application/json',
                success: function (results) {
                    calendarEvents = results.Reminders;
                    console.log(calendarEvents)

                    let formattedReminders = calendarEvents.map(reminder => {
                        let formattedDate = reminder.DueDate.split('T')[0];  // Split by 'T' to get the date part
                        return { id: reminder.ReminderID, title: reminder.Name, start: formattedDate, notes: reminder.Notes };
                    });

                    console.log(formattedReminders);

                    // Initialize FullCalendar after fetching events
                    var calendarEl = document.getElementById('calendar');
                    var calendar = new FullCalendar.Calendar(calendarEl, {
                        initialView: 'dayGridMonth',
                        themeSystem: 'bootstrap',
                        selectable: true,
                        dateClick: function (info) {
                            $('#createEventPopup').modal('show');
                            $('#btnCreateEvent').on('click', function(){
                                let eventName = $('#txtCreateTitle').val();
                                let eventDate = info.dateStr;
                                let eventNotes = $('#txtCreateNotes').val();

                                $.ajax({
                                    url: `${apiCall}/addReminder`,
                                    type: 'POST',
                                    data: JSON.stringify({
                                        uuidSessionToken: sessionStorage.getItem('SimpleSession'),
                                        strName: eventName,
                                        strDueDate: eventDate,
                                        strNotes: eventNotes
                                    }),
                                    contentType: 'application/json',
                                    success: function (data) {
                                        $('#createEventPopup').modal('hide');
                                        $('#txtCreateTitle').val('');
                                        $('#txtCreateNotes').val('');
                                        Swal.fire({
                                            title: 'Event Created',
                                            text: 'Event has been created successfully',
                                            icon: 'success',
                                            confirmButtonText: 'OK',
                                            timer: 1500
                                        }).then((result) => {
                                            location.reload();
                                        });
                                    }

                                })
                            })
                        },
                        events: formattedReminders,  // Use the events fetched from the server
                        eventClick: function (info) {
                            // Store the clicked event
                            selectedEvent = info.event;
                            
                            // Populate the modal fields with the event's details
                            $('#txtEditTitle').val(selectedEvent.title);
                            $('#txtEditDate').val(selectedEvent.startStr);
                            $('#txtEditNotes').val(selectedEvent.extendedProps.notes);

                            // Show the modal
                            $('#eventDetailsPopup').modal('show');

                          $('#btnDelete').off('click').on('click', function () {
                              // Show SweetAlert confirmation dialog
                              SweetAlert.fire({
                                  title: `Do you really want to delete the event '${info.event.title}'?`,
                                  icon: 'warning',
                                  showCancelButton: true,
                                  confirmButtonColor: '#d33',
                                  cancelButtonColor: '#3085d6',
                                  confirmButtonText: 'Yes, delete it!',
                                  cancelButtonText: 'Cancel',
                                  width: '500px'
                              }).then((result) => {
                                  if (result.isConfirmed) {
                                      // Remove event from FullCalendar
                                      info.event.remove();

                                      // Make AJAX request to delete event from the server
                                      $.ajax({
                                          type: 'DELETE',
                                          url: `${apiCall}/deleteReminder`, // Assuming you have a delete endpoint
                                          data: JSON.stringify({
                                              uuidSessionToken: sessionStorage.getItem('SimpleSession'),
                                              intReminderID: info.event.id // Send the event ID for deletion
                                          }),
                                          contentType: 'application/json',
                                          success: function () {
                                              SweetAlert.fire({
                                                  title: 'Event deleted successfully!',
                                                  icon: 'success',
                                                  showCancelButton: false,
                                                  showConfirmButton: false,
                                                  width: '500px',
                                                  timer: 1500
                                              });
                                              setTimeout(() => {
                                                location.reload();
                                              }, 1000*2);
                                          },
                                          error: function () {
                                              SweetAlert.fire({
                                                  title: 'Failed to delete the event.',
                                                  icon: 'error',
                                                  showCancelButton: false,
                                                  showConfirmButton: false,
                                                  width: '500px',
                                                  timer: 1500
                                              });
                                          }

                                          
                                      });
                                  }
                              });
                              
                          });

                          
                    },
                    });

                    calendar.render();  // Render calendar after initializing it

                }
            });


            // Recent activity module

            // The hex code for the icons is #3A6EA1
            const recentActivityList = document.getElementById("recentActivityList");

            $.ajax({
                type: 'POST',
                url: `${apiCall}/getActivity`,
                data: JSON.stringify({ uuidSessionToken: sessionStorage.getItem('SimpleSession'), intLimit: 25 }),
                contentType: 'application/json',
                success: function (results) {
                    console.log(results);
                    results.Activity.forEach(activity => {
                        let listItem = '';
                        let activityUrl = '#'; // Default URL
                        let iconPath = ''; // Icon path variable

                        const description = activity.ActivityDescription.toLowerCase();
                        const argument = activity.ActivityArgument;

                        // Assign icons based on activity description
                        if (description.includes('deleted')) {
                            iconPath = "assets/icons/trash-solid.svg";
                        } else if (description.includes('added')) {
                            iconPath = "assets/icons/plus-solid.svg";
                        } else {
                            iconPath = "assets/icons/user-pen-solid.svg";
                        }

                        // Assign relative URLs based on activity description and argument
                        if (description.includes('po')) {
                            activityUrl = description.includes('deleted')
                                ? `index.html?table=purchaseOrders`
                                : `pages/viewPO.html?POID=${argument}`;
                        } else if (description.includes('vendor')) {
                            activityUrl = description.includes('deleted')
                                ? `index.html?table=vendors`
                                : `pages/viewVendor.html?VendorName=${argument}`;
                        } else if (description.includes('account')) {
                            activityUrl = description.includes('deleted')
                                ? `index.html?table=accounts`
                                : `pages/viewAccount.html?AccountID=${argument}`;
                        }

                        // Build the list item HTML
                        listItem = `
                            <li class="list-group-item activity-item" data-url="${activityUrl}">
                                <img src="${iconPath}" alt="Icon" style="width: 16px; height: 16px; margin-right: 8px;">
                                ${activity.ResponsibleUser} ${activity.ActivityDescription}
                            </li>`;

                        // Append the list item to the list
                        $('#recentActivityList').append(listItem);
                    });

                    // Add click event listener for each activity item
                    document.querySelectorAll('.activity-item').forEach(item => {
                        item.addEventListener('click', function () {
                            const url = this.getAttribute('data-url');
                            if (url && url !== '#') {
                                window.location.href = url; // Navigate to the specified URL
                            }
                        });
                    });
                }
            });


            // Chart 1: Doughnut chart
            // Use asynchronous function to fill the donut chart (avoids error if the data is not ready as soon as the page loads)
            async function fillDonutChart() {
                try {
                    const response = await fetch(`${apiCall}/fillDonutChart`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'uuidSessionToken': sessionStorage.getItem('SimpleSession'),
                        },
                        body: JSON.stringify({})
                    });

                    const jsonResponse = await response.json();

                    // Check if the response is valid
                    if (!response.ok) {
                        console.error("Error Filling Donut Chart: ", jsonResponse);
                    } else {
                        const AccountTotals = jsonResponse;

                        // Once the data is ready, make the donut chart
                        let ctx1 = document.getElementById('chart1').getContext('2d');
                        doughnutChart = new Chart(ctx1, {
                            type: 'doughnut',
                            data: {
                                labels: ['Administration' + '(' + AccountTotals.accountTotals[0].account_category + ')',
                                'Uniform Patrol' + '(' + AccountTotals.accountTotals[1].account_category + ')',
                                'Investigative' + '(' + AccountTotals.accountTotals[2].account_category + ')',
                                'Traffic' + '(' + AccountTotals.accountTotals[3].account_category + ')',
                                AccountTotals.accountTotals[4].account_category
                                ],
                                datasets: [{
                                    label: 'category total $',
                                    data: [AccountTotals.accountTotals[0].total,
                                    AccountTotals.accountTotals[1].total,
                                    AccountTotals.accountTotals[2].total,
                                    AccountTotals.accountTotals[3].total,
                                    AccountTotals.accountTotals[4].total],
                                    backgroundColor: [
                                        'rgba(255, 99, 132, 0.6)',
                                        'rgba(54, 162, 235, 0.6)',
                                        'rgba(255, 206, 86, 0.6)',
                                        'rgba(75, 192, 192, 0.6)',
                                        'rgba(153, 102, 255, 0.6)'
                                    ],
                                    borderColor: 'white',
                                    borderWidth: 2,
                                }]
                            },
                            options: {
                                responsive: false,
                                plugins: {
                                    title: {
                                        display: true,
                                        text: 'Budget Categories',
                                        font: {
                                            size: 20,
                                        },
                                    },
                                    legend: {
                                        position: 'right',
                                    },
                                },
                            },
                        });
                    }

                } catch (error) {
                    console.error("Error Filling Donut Chart: ", error);
                }
            };

            // Call the async function
            fillDonutChart();

            // Chart 2: Bar chart
            async function fillBarChart() {
                try {
                    const response = await fetch(`${apiCall}/fillBarChart`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'uuidSessionToken': sessionStorage.getItem('SimpleSession'),
                        },
                        body: JSON.stringify({})
                    });

                    const AccountTotals = await response.json();

                    console.log('Account Totals: ', AccountTotals);

                    // Check if the response is valid
                    if (!response.ok) {
                        console.error("Error Filling Bar Chart: ", jsonResponse);
                    } else {

                        // Once the data is ready, make the bar chart
                        let ctx2 = document.getElementById('chart2').getContext('2d');
                        barChart = new Chart(ctx2, {
                            type: 'bar',
                            data: {
                                labels: ['Budget Categories'],
                                datasets: [
                                    {
                                        label: 'admin current total $',
                                        data: [AccountTotals.accountTotals[0].current_total],
                                        backgroundColor: ['rgba(255, 99, 132, 0.6)'],
                                        borderColor: 'white',
                                        borderWidth: 2,
                                    },
                                    {
                                        label: 'admin budget total $',
                                        data: [AccountTotals.accountTotals[0].budget_total],
                                        backgroundColor: ['rgba(255, 99, 132, 0.6)'],
                                        borderColor: 'white',
                                        borderWidth: 2,
                                    },
                                    {
                                        label: 'uniform current total $',
                                        data: [AccountTotals.accountTotals[1].current_total],
                                        backgroundColor: ['rgba(54, 162, 235, 0.6)'],
                                        borderColor: 'white',
                                        borderWidth: 2,
                                    },
                                    {
                                        label: 'uniform budget total $',
                                        data: [AccountTotals.accountTotals[1].budget_total],
                                        backgroundColor: ['rgba(54, 162, 235, 0.6)'],
                                        borderColor: 'white',
                                        borderWidth: 2,
                                    },
                                    {
                                        label: 'investigative current total $',
                                        data: [AccountTotals.accountTotals[2].current_total],
                                        backgroundColor: ['rgba(255, 206, 86, 0.6)'],
                                        borderColor: 'white',
                                        borderWidth: 2,
                                    },
                                    {
                                        label: 'investigative budget total $',
                                        data: [AccountTotals.accountTotals[2].budget_total],
                                        backgroundColor: ['rgba(255, 206, 86, 0.6)'],
                                        borderColor: 'white',
                                        borderWidth: 2,
                                    },
                                    {
                                        label: 'traffic current total $',
                                        data: [AccountTotals.accountTotals[3].current_total],
                                        backgroundColor: ['rgba(75, 192, 192, 0.6)'],
                                        borderColor: 'white',
                                        borderWidth: 2,
                                    },
                                    {
                                        label: 'traffic budget total $',
                                        data: [AccountTotals.accountTotals[3].budget_total],
                                        backgroundColor: ['rgba(75, 192, 192, 0.6)'],
                                        borderColor: 'white',
                                        borderWidth: 2,
                                    },
                                    {
                                        label: 'other current total $',
                                        data: [AccountTotals.accountTotals[4].current_total],
                                        backgroundColor: ['rgba(153, 102, 255, 0.6)'],
                                        borderColor: 'white',
                                        borderWidth: 2,
                                        hidden: true,
                                    },
                                    {
                                        label: 'other budget total $',
                                        data: [AccountTotals.accountTotals[4].budget_total],
                                        backgroundColor: ['rgba(153, 102, 255, 0.6)'],
                                        borderColor: 'white',
                                        borderWidth: 2,
                                        hidden: true,
                                    },
                                ],
                            },
                            options: {
                                responsive: false,
                                maintainAspectRatio: false,
                                plugins: {
                                    title: {
                                        display: true,
                                        text: 'Current totals and budget totals',
                                        font: {
                                            size: 20,
                                        },
                                    },
                                    legend: {
                                        position: 'right',
                                    },
                                },
                                scales: {
                                    x: {
                                        stacked: false,
                                    },
                                    y: {
                                        stacked: false,
                                    }
                                }
                            }
                        });
                    }
                } catch (error) {
                    console.error("Error Filling Bar Chart: ", error);
                }
            };

            fillBarChart();

            // Chart 3: Line chart
            let ctx3 = document.getElementById('chart3').getContext('2d');
            lineChart = new Chart(ctx3, {
                type: 'line',
                data: {
                    labels: ['Week 1', 'Week 2', 'Week 3', 'Week 4'],
                    datasets: [{
                        label: 'Website Visitors',
                        data: [140, 150, 170, 130],
                        backgroundColor: 'rgba(255, 206, 86, 0.6)',
                        borderColor: 'rgba(255, 206, 86, 1)',
                        fill: true
                    }],
                    options: {
                        responsive: false,
                        maintainAspectRatio: false,
                    }
                }
            });
        });


    $('#btnEdit').click(function () {
        // Close the modal first
        $('#eventDetailsPopup').modal('hide');

        // Retrieve values from the input fields
        var strName = $('#txtEditTitle').val();
        var strDate = $('#txtEditDate').val();
        var strNotes = $('#txtEditNotes').val();

        // Make an AJAX request to update the event on the server
        $.ajax({
          type: 'PUT',
          url: `${apiCall}/updateReminder`,
          data: JSON.stringify({
              uuidSessionToken: sessionStorage.getItem('SimpleSession'),
              strName: strName,
              strDueDate: strDate,
              strNotes: strNotes,
              strID: selectedEvent.id
          }),
          contentType: 'application/json',
          success: function (response) {
              console.log('Update Success:', response);
                location.reload();
                // Update the event in FullCalendar
                selectedEvent.setProp('title', strName);
                selectedEvent.setStart(strDate);
                selectedEvent.setEnd(null); // For single-day events
                selectedEvent.setExtendedProp('strNotes', strNotes);

                // Optionally, refetch events
                calendar.refetchEvents();

              SweetAlert.fire({
                  title: 'Event updated successfully!',
                  icon: 'success',
                  showCancelButton: false,
                  showConfirmButton: false,
                  width: '500px',
                  timer: 1500
              });
          },
          error: function (jqXHR, textStatus, errorThrown) {
              console.error('Update Failed:', textStatus, errorThrown);
              console.error('Response:', jqXHR.responseText);
              SweetAlert.fire({
                  title: 'Failed to update the event.',
                  icon: 'error',
                  showCancelButton: false,
                  showConfirmButton: false,
                  width: '500px',
                  timer: 1500
              });
          },
        });
    });

        
    </script>
</body>
