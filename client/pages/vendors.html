<html lang="en">

<style>
    .copyButton {
        background-color: #2c3e50;
        border-color: #2c3e50;
    }

    .excelButton {
        background-color: #2c3e50;
        border-color: #2c3e50;
    }

    .printButton {
        background-color: #2c3e50;
        border-color: #2c3e50;
    }

    .invalid {
        box-shadow: 0 0 2px 2px #fd0000;
    }
</style>

<body>
    <div class="col-12 d-flex justify-content-center mt-2">
        <div class="card col-12 col-md-10 col-lg-9">
            <div class="card-header">
                <div class="row">
                    <h3 class="col-8">Vendors</h3>
                    <button id="btnVendorModal" type="button" class="btn btn-primary col-4" data-bs-toggle="modal" data-bs-target="#newVendor"> Create New Vendor</button>
                </div>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped responsive" id="tblVendors">
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- New Vendor Modal -->
    <div class="modal fade" id="newVendor" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1"
        aria-labelledby="staticBackdropLabel">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="staticBackdropLabel">Create New Vendor</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form>
                    <div class="modal-body">
                        <label for="txtVendor" class="form-label">Vendor Name</label>
                        <input type="text" class="form-control req" id="txtVendor" placeholder="Vendor Name" required>

                        <label for="txtLink" class="form-label">Website Link</label>
                        <input type="text" class="form-control" id="txtLink" placeholder="Link">
                        <hr>

                        <label for="txtVendorContactName" class="form-label">Vendor Contact</label>
                        <input type="text" class="form-control" id="txtVendorContactName" placeholder="Vendor Contact">

                        <label for="txtVendorEmail" class="form-label">Contact Email</label>
                        <input type="email" class="form-control" id="txtVendorEmail" placeholder="example@gmail.com">

                        <div class="row mt-2">
                            <div class="form-group col-6">
                                <label for="txtStreetAddress1" class="form-label">Street Address 1</label>
                                <input type="text" class="form-control" id="txtStreetAddress1" placeholder="Street Address 1">
                            </div>
                            <div class="form-group col-6">
                                <label for="txtStreetAddress2" class="form-label">Street Address 2</label>
                                <input type="text" class="form-control" id="txtStreetAddress2" placeholder="Street Address 2">
                            </div>
                        </div>

                        <div class="row mt-2">
                            <div class="form-group col-5">
                                <label for="txtCity" class="form-label">City</label>
                                <input type="text" class="form-control" id="txtCity" placeholder="City">
                            </div>
                            <div class="form-group col-4">
                                <label for="txtState" class="form-label relative">State</label>
                                <select type="text" class="form-select" id="txtState" aria-label="State Select">
                                    <option selected disabled>Select State...</option>
                                </select>
                            </div>
                            <div class="form-group col-3">
                                <label for="txtZip" class="form-label">ZIP Code</label>
                                <input type="text" class="form-control" id="txtZip" placeholder="ZIP Code">
                            </div>
                        </div>

                        <div class="row">
                            <div class="form-group col-6">
                                <label for="txtOfficePhone" class="form-label mt-2">Office Phone</label>
                                <input type="tel" class="form-control" id="txtOfficePhone" placeholder="123-456-7890">
                            </div>
                            <div class="form-group col-6">
                                <label for="txtMobilePhone" class="form-label mt-2">Mobile Phone</label>
                                <input type="tel" class="form-control" id="txtMobilePhone" placeholder="123-456-7890">
                            </div>
                        </div>

                        <label for="txtFax" class="form-label mt-2">Fax Number</label>
                        <input type="text" class="form-control" id="txtFax" placeholder="123456789">
                    </div>

                    <!--Error messages. Default Hidden-->
                    <div id="WarningErrorMessagePopUp" class="alert alert-warning" style="display:none;">
                        <h4 class="alert-heading">Warning!</h4>
                        <p class="mb-0" id="txtErrorMsg"></p>
                    </div>
                    <div class="modal-footer">
                        <button id="btnCreateVendor" type="button" class="btn btn-success" aria-label="Create new vendor">Create</button>
                        <button type="button" class="btn btn-primary" data-bs-dismiss="modal" aria-label="Close vendor modal">Close</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js" integrity="sha384-cn7l7gDp0eyniUwwAZgrzD06kc/tftFfF7eSY6KjX83lXvyPcLa5VOWMR4Em10Ej" crossorigin="anonymous"></script>
    <script src="./assets/js/utils.js"></script>
    <script>
        function viewPage(pageName, vendorName) {
            window.location.href = pageName + "?VendorName=" + vendorName;
            $('#divMain').load(pageName);
        }

        $(document).ready(function () {
            $.ajax({ // Fill Vendor table on page
                type: 'POST',
                url: `${apiCall}/fillVendorTable`,
                data: JSON.stringify({ uuidSessionToken: sessionStorage.getItem('SimpleSession') }),
                contentType: 'application/json',
                success: function (results) {
                    console.log('Response:', results);
                    if (Array.isArray(results.VendorTable)) {
                        // Initialize DataTable after data is appended
                        $('#tblVendors').DataTable({
                            layout: {
                                topStart: {
                                    buttons: [
                                        { extend: 'copy', className: 'copyButton' },
                                        { extend: 'excel', className: 'excelButton' },
                                        { extend: 'print', className: 'printButton' , title: ''}
                                    ]
                                }
                            },
                            "autowidth": false,
                            data: results.VendorTable,
                            columns: [
                                { data: "VendorName", title: "Vendor Name", render: function (data, type) {
                                        if (type == "display") {
                                            return '<a href="#" onclick="viewPage(\'pages/viewVendor.html\', \'' + data + '\')">' + data + "</a>";
                                        }
                                        return data;
                                    }},
                                { data: "Website", title: "Link", render: function (data, type) {
                                        if (type == "display") {
                                            return '<a href="http://' + data + '" target="_blank">' + data + "</a>";
                                        }
                                        return data;
                                    }},
                                { data: "Status", title: "Status", render: function (data, type) {
                                        if (type == "display") {
                                            return (data == "1") ? "Active" : "Inactive";
                                        }
                                        return data;
                                    }}
                            ],
                        });
                    } else {
                        console.error('Unexpected response format or status:', results);
                    }
                },
                error: function (xhr, status, error) {
                    console.error('AJAX Error:', status, error);
                }
            });
        });

        // Fills state select in form
        $('#btnVendorModal').on('click', function () {
            let statesUSA = ['ALAlabama', 'AKAlaska', 'AZArizona', 'ARArkansas', 'CACalifornia', 'COColorado', 'CTConnecticut', 'DCWashington D.C.', 'DEDelaware', 'FLFlorida', 'GAGeorgia', 'HIHawaii', 'IDIdaho', 'ILIllinois', 'INIndiana', 'IAIowa', 'KSKansas', 'KYKentucky', 'LALouisiana', 'MEMaine', 'MDMaryland', 'MAMassachusetts', 'MIMichigan', 'MNMinnesota', 'MSMississippi', 'MOMissouri', 'MTMontana', 'NENebraska', 'NVNevada', 'NHNew Hampshire', 'NJNew Jersey', 'NMNew Mexico', 'NYNew York', 'NCNorth Carolina', 'NDNorth Dakota', 'OHOhio', 'OKOklahoma', 'OROregon', 'PAPennsylvania', 'RIRhode Island', 'SCSouth Carolina', 'SDSouth Dakota', 'TNTennessee', 'TXTexas', 'UTUtah', 'VTVermont', 'VAVirginia', 'WAWashington', 'WVWest Virginia', 'WIWisconsin', 'WYWyoming'];
            statesUSA.forEach(element => {
                $('#txtState').append('<option value="' + element.slice(0, 2) + '">' + element.slice(2, element.length) + '</option>');
            });
        });

        // Cleans/sends Vendor input to backend
        $('#btnCreateVendor').on('click', function () {
            let strVendorName = $('#txtVendor').val();
            let strVendorLink = $('#txtLink').val();
            let strVendorContactName = $('#txtVendorContactName').val();
            let strEmail = $('#txtVendorEmail').val();
            let strStreetAddress1 = $('#txtStreetAddress1').val();
            let strStreetAddress2 = $('#txtStreetAddress2').val();
            let strCity = $('#txtCity').val();
            let strState = $('#txtState').val();
            let strZip = $('#txtZip').val();
            let strOfficePhone = $('#txtOfficePhone').val();
            let strMobilePhone = $('#txtMobilePhone').val();
            let strFax = $('#txtFax').val();
            let intCreatedBy = parseInt(sessionStorage.getItem('userId'));
            let strErrorMessage = '';

            // Error checking
            if (strVendorName == '') {
                strErrorMessage += "<p>Please specify a vendor name.</p>";
            } if (strVendorName.length > 70) {
                strErrorMessage += "<p>Vendor name is too long</p>";
            } if (strVendorLink.length > 65) {
                strErrorMessage += "<p>Webiste link is too long</p>";
            } if (strVendorContactName == '') {
                strErrorMessage += "<p>Please specify a vendor contact.</p>";
            } if (strVendorContactName.length > 46) {
                strErrorMessage += "<p>Vendor contact is too long</p>";
            } if (strOfficePhone == '' && strMobilePhone == '' && strEmail == '' && strFax == '') {
                strErrorMessage += "<p>Please enter at least one of the following: Office Phone, Mobile Phone, Email, Fax Number</p>";
            } if (strEmail.length > 50) {
                strErrorMessage += "<p>Email is too long</p>"
            } if (strStreetAddress1.length > 50) {
                strErrorMessage += "<p>Street Address 1 is too long</p>";
            } if (strStreetAddress2.length > 50) {
                strErrorMessage += "<p>Street Address 2 is too long</p>";
            } if (strCity.length > 50) {
                strErrorMessage += "<p>City is too long</p>"
            } if (strState == null) {
                strState = '';
            } if (strZip.length > 10) {
                strErrorMessage += "<p>ZIP Code is too long</p>";
            } if (strOfficePhone.length > 12) {
                strErrorMessage += "<p>Office Phone is too long</p>";
            } if (strMobilePhone.length > 12) {
                strErrorMessage += "<p>Mobile Phone is too long</p>";
            } if (strFax.length > 12) {
                strErrorMessage += "<p>Fax number is too long</p>";
            } if (strErrorMessage.length > 0) { // Error message
                console.log(strErrorMessage);
                $('#txtErrorMsg').html(strErrorMessage);
                $('#WarningErrorMessagePopUp').show();
            } else {
                $.ajax({ // Send input info to backend
                    type: 'POST',
                    url: `${apiCall}/addVendor`,
                    data: JSON.stringify({ uuidSessionToken: sessionStorage.getItem('SimpleSession'), strVendorName: strVendorName, strVendorLink: strVendorLink, strVendorContactName: strVendorContactName, strEmail:strEmail, strStreetAddress1: strStreetAddress1, strStreetAddress2, strStreetAddress2, strCity: strCity, strState: strState, strZip: strZip, strOfficePhone: strOfficePhone, strMobilePhone: strMobilePhone, strFax: strFax, intCreatedBy: intCreatedBy }),
                    contentType: 'application/json',
                    success:
                        function (results) {
                            console.log('Response:', results);
                            $('#newVendor').modal('hide');
                            returnHome("vendors", false);
                        },
                    error:
                        function (xhr, status, error) {
                            console.error('AJAX Error:', status, error);
                            // Pop up the error message from server side validation
                            $('#txtErrorMsg').html(xhr.responseJSON.message);
                            $('#WarningErrorMessagePopUp').show();
                        }
                });
            }
        });

    </script>
</body>

</html>
